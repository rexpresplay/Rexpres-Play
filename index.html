<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rexpres Play - Catálogo Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .step-hidden { display: none !important; }
        body { background-color: #000000; color: white; font-family: ui-sans-serif, system-ui; overflow-x: hidden; }
        .bg-azul-rex { background-color: #001e85; }
        .bg-naranja-rex { background-color: #f7941d; }
        .card-rex { background-color: #0a0a0a; border: 1px solid #1a1a1a; }
        
        /* Slider de Banners */
        .slider-container { 
            position: relative; 
            overflow: hidden; 
            border-radius: 1.5rem; 
            height: 180px; 
            margin-bottom: 2rem;
            background-color: #111;
        }
        @media (min-width: 768px) {
            .slider-container { height: 350px; }
        }
        .slide { 
            position: absolute; 
            inset: 0; 
            opacity: 0; 
            transition: opacity 1s ease-in-out; 
            background-size: cover; 
            background-position: center; 
        }
        .slide.active { opacity: 1; }
    </style>
</head>
<body class="bg-black">

    <header class="p-4 bg-black border-b border-zinc-800 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <img src="logo.png" alt="Rexpres Play" class="h-10 md:h-14 w-auto">
            <span class="text-[10px] md:text-xs text-zinc-500 font-bold uppercase tracking-widest italic">Ecuador</span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 md:p-8">
        
        <section id="step-1">
            <div class="slider-container border border-zinc-800 shadow-2xl">
                <div class="slide active" style="background-image: url('banner1.png');"></div>
                <div class="slide" style="background-image: url('banner2.png');"></div>
            </div>

            <div class="text-center mb-10">
                <h2 class="text-2xl md:text-4xl font-black uppercase italic tracking-tighter text-white">¿Qué deseas realizar hoy?</h2>
                <p class="text-zinc-500 text-xs md:text-base uppercase tracking-widest mt-2 font-bold italic">Selecciona un servicio</p>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <button onclick="showSubCategory()" class="bg-azul-rex p-8 md:p-12 rounded-3xl flex items-center gap-6 hover:scale-[1.02] transition-all shadow-xl group text-left border border-blue-400/20">
                    <img src="topup.svg" class="w-16 h-16 md:w-20 md:h-20" alt="Recargas">
                    <div>
                        <p class="font-black text-xl md:text-3xl leading-tight text-white uppercase italic">Recargas Móviles</p>
                        <p class="text-xs md:text-sm text-blue-200 uppercase tracking-widest mt-1">Saldo y Paquetes</p>
                    </div>
                </button>

                <button onclick="showStep(2, 'juegos')" class="bg-naranja-rex p-8 md:p-12 rounded-3xl flex items-center gap-6 hover:scale-[1.02] transition-all shadow-xl group text-left border border-orange-400/20">
                    <span class="text-5xl md:text-7xl group-hover:rotate-6 transition-transform">🎮</span>
                    <div>
                        <p class="font-black text-xl md:text-3xl leading-tight text-white uppercase italic">Videojuegos</p>
                        <p class="text-xs md:text-sm text-orange-100 uppercase tracking-widest mt-1">Diamantes y Monedas</p>
                    </div>
                </button>
            </div>
        </section>

        <section id="step-sub" class="step-hidden">
            <div class="flex items-center justify-between mb-8">
                <button onclick="goBack(1)" class="text-zinc-400 hover:text-white transition flex items-center text-sm font-bold uppercase tracking-widest">
                    <span class="mr-2">←</span> Volver al inicio
                </button>
                <h2 class="text-xl md:text-2xl font-black italic uppercase text-center flex-1">Selecciona el tipo</h2>
                <div class="w-10"></div>
            </div>
            
            <div class="grid grid-cols-2 gap-6 max-w-2xl mx-auto">
                <button onclick="showStep(2, 'recargas', 'Recargas')" class="bg-zinc-900 border border-zinc-800 p-8 rounded-3xl hover:border-blue-500 transition-all group flex flex-col items-center gap-4">
                    <img src="topup.svg" class="w-16 h-16" alt="Recargas">
                    <span class="font-black uppercase italic tracking-widest text-sm md:text-lg">Recargas</span>
                </button>

                <button onclick="showStep(2, 'recargas', 'Paquetes')" class="bg-zinc-900 border border-zinc-800 p-8 rounded-3xl hover:border-blue-500 transition-all group flex flex-col items-center gap-4">
                    <img src="package.svg" class="w-16 h-16" alt="Paquetes">
                    <span class="font-black uppercase italic tracking-widest text-sm md:text-lg">Paquetes</span>
                </button>
            </div>
        </section>

        <section id="step-2" class="step-hidden">
            <div class="flex items-center justify-between mb-8">
                <button id="btn-back-step2" class="text-zinc-400 hover:text-white transition flex items-center text-sm font-bold uppercase tracking-widest">
                    <span class="mr-2">←</span> Regresar
                </button>
                <h2 id="title-step-2" class="text-xl md:text-3xl font-black italic uppercase text-center flex-1 text-white"></h2>
                <div class="w-10"></div>
            </div>
            <div id="grid-options" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6"></div>
        </section>

        <section id="step-3" class="step-hidden flex justify-center">
            <div class="card-rex p-8 md:p-12 rounded-[2rem] shadow-2xl w-full max-w-lg border-t-4 border-zinc-700">
                <button onclick="goBack(2)" class="text-zinc-400 mb-6 inline-block text-xs font-bold uppercase tracking-widest hover:text-white">← Regresar</button>
                <h2 id="brand-selected" class="text-3xl md:text-4xl font-black mb-8 text-center uppercase italic text-white"></h2>
                <div id="form-fields" class="space-y-6"></div>
                <button onclick="enviarPedido()" class="w-full mt-10 bg-green-600 hover:bg-green-500 text-white font-black py-5 rounded-2xl shadow-lg transition-all uppercase tracking-widest text-base">
                    Confirmar pedido
                </button>
            </div>
        </section>

    </main>

    <script>
        // Lógica de Slider
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        function nextSlide() {
            if (slides.length > 0) {
                slides[currentSlide].classList.remove('active');
                currentSlide = (currentSlide + 1) % slides.length;
                slides[currentSlide].classList.add('active');
            }
        }
        setInterval(nextSlide, 4000);

        let currentOrder = {};

        // Mapa de imágenes para operadoras
        const imageMap = {
            'Claro': 'claro.webp',
            'Movistar': 'movistar.webp',
            'Tuenti': 'tuenti.webp',
            'CNT': 'cnt.webp',
            'Aki Móvil': 'akimovil (1).webp',
            'Maxi Plus': 'maxiplus.webp'
        };

        function hideAllSteps() {
            ['step-1', 'step-sub', 'step-2', 'step-3'].forEach(id => {
                document.getElementById(id).classList.add('step-hidden');
            });
        }

        function showSubCategory() {
            hideAllSteps();
            document.getElementById('step-sub').classList.remove('step-hidden');
            window.scrollTo(0,0);
        }

        function showStep(step, type = '', subType = '') {
            hideAllSteps();
            document.getElementById(`step-${step}`).classList.remove('step-hidden');
            const backBtn = document.getElementById('btn-back-step2');

            if(type === 'recargas') {
                currentOrder.categoria = subType; 
                document.getElementById('title-step-2').innerText = 'Operadoras';
                renderBrands(['Claro', 'Movistar', 'CNT', 'Tuenti', 'Aki Móvil', 'Maxi Plus']);
                backBtn.onclick = () => showSubCategory();
            } else if(type === 'juegos') {
                currentOrder.categoria = 'Juegos';
                document.getElementById('title-step-2').innerText = 'Videojuegos';
                renderBrands(['Free Fire', 'Roblox', 'Call of Duty', 'Mobile Legends']);
                backBtn.onclick = () => goBack(1);
            }
            window.scrollTo(0,0);
        }

        function renderBrands(brands) {
            const grid = document.getElementById('grid-options');
            grid.innerHTML = '';
            brands.forEach(b => {
                const imgFile = imageMap[b];
                
                if(imgFile) {
                    // Render para Operadoras con imagen
                    grid.innerHTML += `
                        <button onclick="selectBrand('${b}')" class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl hover:border-white transition-all flex flex-col items-center gap-4 group">
                            <div class="w-20 h-20 md:w-24 md:h-24 flex items-center justify-center">
                                <img src="${imgFile}" alt="${b}" class="max-w-full max-h-full object-contain group-hover:scale-110 transition-transform">
                            </div>
                            <span class="font-bold uppercase text-[10px] md:text-xs tracking-widest text-zinc-400 group-hover:text-white">${b}</span>
                        </button>`;
                } else {
                    // Render para Juegos con botones de texto elegantes
                    grid.innerHTML += `
                        <button onclick="selectBrand('${b}')" class="bg-zinc-900 border border-zinc-800 p-8 rounded-2xl hover:border-white transition-all font-bold uppercase text-xs md:text-sm tracking-widest text-center text-white">
                            ${b}
                        </button>`;
                }
            });
        }

        function selectBrand(brand) {
            currentOrder.marca = brand;
            const fields = document.getElementById('form-fields');
            document.getElementById('brand-selected').innerText = brand;
            
            const isRecarga = (currentOrder.categoria === 'Recargas' || currentOrder.categoria === 'Paquetes');
            const placeholderMonto = currentOrder.categoria === 'Paquetes' ? 'Ej: Paquete de 5GB' : 'Ej: $3, $5, $10';

            fields.innerHTML = `
                <div class="space-y-2 text-left">
                    <label class="text-xs text-zinc-500 uppercase font-black tracking-widest ml-1">${isRecarga ? 'Número de Celular' : 'ID de Jugador'}</label>
                    <input type="text" id="input-id" class="w-full bg-zinc-900 border border-zinc-800 p-5 rounded-2xl text-white outline-none focus:ring-2 focus:ring-blue-600" placeholder="${isRecarga ? '09xxxxxxxx' : 'ID del juego'}">
                </div>
                <div class="space-y-2 text-left">
                    <label class="text-xs text-zinc-500 uppercase font-black tracking-widest ml-1">${isRecarga ? 'Monto / Detalle' : 'Cantidad'}</label>
                    <input type="text" id="input-monto" class="w-full bg-zinc-900 border border-zinc-800 p-5 rounded-2xl text-white outline-none focus:ring-2 focus:ring-blue-600" placeholder="${placeholderMonto}">
                </div>`;
            
            hideAllSteps();
            document.getElementById('step-3').classList.remove('step-hidden');
            window.scrollTo(0,0);
        }

        function enviarPedido() {
            const id = document.getElementById('input-id').value;
            const monto = document.getElementById('input-monto').value;
            if(!id || !monto) return alert('Por favor completa los datos');
            const numeroWhatsApp = "593992225484";
            const msg = `¡Hola Rexpres Play! 🚀\n\n*Servicio:* ${currentOrder.categoria}\n*Marca:* ${currentOrder.marca}\n*ID/Número:* ${id}\n*Monto/Detalle:* ${monto}`;
            window.open(`https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(msg)}`);
        }

        function goBack(step) {
            hideAllSteps();
            if(step === 1) {
                document.getElementById('step-1').classList.remove('step-hidden');
            } else if(step === 2) {
                showStep(2, (currentOrder.categoria === 'Juegos' ? 'juegos' : 'recargas'), currentOrder.categoria);
            }
        }
    </script>
</body>
</html>
