<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rexpres Play - Catálogo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .step-hidden { display: none; }
        body { background-color: #000000; color: white; font-family: ui-sans-serif, system-ui; }
        .bg-azul-rex { background-color: #001e85; }
        .bg-naranja-rex { background-color: #f7941d; }
        .card-rex { background-color: #0a0a0a; border: 1px solid #1a1a1a; }
        
        /* Slider Responsivo */
        .slider-container { 
            position: relative; 
            overflow: hidden; 
            border-radius: 1.5rem; 
            height: 200px; /* Altura en móvil */
        }
        @media (min-width: 768px) {
            .slider-container { height: 400px; } /* Altura en computadora */
        }
        .slide { 
            position: absolute; 
            inset: 0; 
            opacity: 0; 
            transition: opacity 1s ease-in-out; 
            background-size: cover; 
            background-position: center; 
        }
        .slide.active { opacity: 1; }
    </style>
</head>
<body class="bg-black">

    <header class="p-4 bg-black border-b border-zinc-800 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <img src="logo.png" alt="Rexpres Play" class="h-10 md:h-14 w-auto">
            <span class="text-[10px] md:text-xs text-zinc-500 font-bold uppercase tracking-widest">Ecuador</span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 md:p-8">
        
        <section id="step-1">
            <div class="slider-container mb-10 border border-zinc-800 shadow-2xl">
                <div class="slide active" style="background-image: url('banner1.png');"></div>
                <div class="slide" style="background-image: url('banner2.png');"></div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 lg:gap-10">
                <button onclick="showStep(2, 'recargas')" class="bg-azul-rex p-8 md:p-12 rounded-3xl flex items-center gap-6 hover:scale-[1.03] transition-all shadow-xl group">
                    <span class="text-4xl md:text-6xl group-hover:rotate-12 transition-transform">📱</span>
                    <div class="text-left">
                        <p class="font-black text-xl md:text-3xl leading-tight text-white uppercase italic">Recargas Móviles</p>
                        <p class="text-xs md:text-sm text-blue-200 uppercase tracking-widest mt-1">Saldo y Paquetes Nacionales</p>
                    </div>
                </button>

                <button onclick="showStep(2, 'juegos')" class="bg-naranja-rex p-8 md:p-12 rounded-3xl flex items-center gap-6 hover:scale-[1.03] transition-all shadow-xl group">
                    <span class="text-4xl md:text-6xl group-hover:rotate-12 transition-transform">🎮</span>
                    <div class="text-left">
                        <p class="font-black text-xl md:text-3xl leading-tight text-white uppercase italic">Videojuegos</p>
                        <p class="text-xs md:text-sm text-orange-100 uppercase tracking-widest mt-1">Diamantes y Monedas Virtuales</p>
                    </div>
                </button>
            </div>
        </section>

        <section id="step-2" class="step-hidden">
            <div class="flex items-center justify-between mb-8">
                <button onclick="goBack(1)" class="text-zinc-400 hover:text-white transition flex items-center text-sm font-bold uppercase tracking-widest">
                    <span class="mr-2">←</span> Volver
                </button>
                <h2 id="title-step-2" class="text-xl md:text-3xl font-black italic uppercase"></h2>
                <div class="w-20"></div>
            </div>
            <div id="grid-options" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6"></div>
        </section>

        <section id="step-3" class="step-hidden flex justify-center">
            <div class="card-rex p-8 md:p-12 rounded-[2rem] shadow-2xl w-full max-w-lg border-t-4 border-zinc-700">
                <button onclick="goBack(2)" class="text-zinc-500 mb-6 inline-block text-xs font-bold uppercase tracking-widest hover:text-white">← Regresar</button>
                <h2 id="brand-selected" class="text-4xl md:text-5xl font-black mb-8 text-center uppercase italic"></h2>
                
                <div id="form-fields" class="space-y-6 text-left"></div>

                <button onclick="enviarPedido()" class="w-full mt-10 bg-green-600 hover:bg-green-500 text-white font-black py-5 rounded-2xl shadow-lg transition-all uppercase tracking-widest text-base">
                    Confirmar por WhatsApp
                </button>
            </div>
        </section>

    </main>

    <script>
        // Slider
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        function nextSlide() {
            if (slides.length > 0) {
                slides[currentSlide].classList.remove('active');
                currentSlide = (currentSlide + 1) % slides.length;
                slides[currentSlide].classList.add('active');
            }
        }
        setInterval(nextSlide, 4000);

        let currentOrder = {};

        function showStep(step, type = '') {
            document.querySelectorAll('section').forEach(s => s.classList.add('step-hidden'));
            document.getElementById(`step-${step}`).classList.remove('step-hidden');

            if(type === 'recargas') {
                currentOrder.categoria = 'Recargas';
                document.getElementById('title-step-2').innerText = 'Operadoras';
                renderBrands(['Claro', 'Movistar', 'CNT', 'Tuenti', 'Maxi Plus']);
            } else if(type === 'juegos') {
                currentOrder.categoria = 'Juegos';
                document.getElementById('title-step-2').innerText = 'Videojuegos';
                renderBrands(['Free Fire', 'Roblox', 'Call of Duty', 'Mobile Legends']);
            }
            window.scrollTo(0,0);
        }

        function renderBrands(brands) {
            const grid = document.getElementById('grid-options');
            grid.innerHTML = '';
            brands.forEach(b => {
                grid.innerHTML += `
                    <button onclick="selectBrand('${b}')" class="bg-zinc-900 border border-zinc-800 p-6 md:p-10 rounded-2xl hover:border-white transition-all font-bold uppercase text-xs md:text-sm tracking-widest shadow-lg">
                        ${b}
                    </button>`;
            });
        }

        function selectBrand(brand) {
            currentOrder.marca = brand;
            const fields = document.getElementById('form-fields');
            const brandLabel = document.getElementById('brand-selected');
            brandLabel.innerText = brand;
            brandLabel.style.color = currentOrder.categoria === 'Recargas' ? '#001e85' : '#f7941d';

            if(currentOrder.categoria === 'Recargas') {
                fields.innerHTML = `
                    <div class="space-y-2">
                        <label class="text-xs text-zinc-500 uppercase font-black tracking-widest ml-1">Número de Celular</label>
                        <input type="tel" id="input-id" class="w-full bg-zinc-900 border border-zinc-800 p-5 rounded-2xl text-white outline-none focus:ring-2 focus:ring-blue-600" placeholder="09xxxxxxxx">
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs text-zinc-500 uppercase font-black tracking-widest ml-1">Monto / Paquete</label>
                        <input type="text" id="input-monto" class="w-full bg-zinc-900 border border-zinc-800 p-5 rounded-2xl text-white outline-none focus:ring-2 focus:ring-blue-600" placeholder="Ej: $10 o Paquete 5GB">
                    </div>`;
            } else {
                fields.innerHTML = `
                    <div class="space-y-2">
                        <label class="text-xs text-zinc-500 uppercase font-black tracking-widest ml-1">ID de Jugador / Usuario</label>
                        <input type="text" id="input-id" class="w-full bg-zinc-900 border border-zinc-800 p-5 rounded-2xl text-white outline-none focus:ring-2 focus:ring-orange-500" placeholder="Ingresa tu ID">
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs text-zinc-500 uppercase font-black tracking-widest ml-1">Cantidad a Recargar</label>
                        <input type="text" id="input-monto" class="w-full bg-zinc-900 border border-zinc-800 p-5 rounded-2xl text-white outline-none focus:ring-2 focus:ring-orange-500" placeholder="Ej: 500 Diamantes">
                    </div>`;
            }
            showStep(3);
        }

        function enviarPedido() {
            const id = document.getElementById('input-id').value;
            const monto = document.getElementById('input-monto').value;
            if(!id || !monto) return alert('Por favor rellena los campos para continuar');

            const numeroWhatsApp = "593992225484";
            const msg = `Hola Rexpres Play! 🚀\n\nHe seleccionado: *${currentOrder.marca}*\n💰 Monto/Producto: ${monto}\n🆔 ID/Número: ${id}\n\nEspero instrucciones para el pago.`;
            window.open(`https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(msg)}`);
        }

        function goBack(step) { showStep(step); }
    </script>
</body>
</html>
