        .step-hidden { display: none !important; }

        .card-rex { background-color: #0a0a0a; border: 1px solid #1a1a1a; }
        
        .slider-container { 
            position: relative; 
            overflow: hidden; 
            border-radius: 1.5rem; 
            height: 180px; 
            margin-bottom: 2rem;
            background-color: #111;
        }
        @media (min-width: 768px) {
            .slider-container { height: 350px; }
        }
        .slide { 
            position: absolute; 
            inset: 0; 
            opacity: 0; 
            transition: opacity 1s ease-in-out; 
            background-size: cover; 
            background-position: center; 
        }
        .slide.active { opacity: 1; }
    </style>

        function showSubCategory() {
            hideAllSteps();
            document.getElementById('step-sub').classList.remove('step-hidden');
            window.scrollTo(0,0);
        }

        function showStep(step, type = '', subType = '') {
            hideAllSteps();
            document.getElementById(`step-${step}`).classList.remove('step-hidden');
            const backBtn = document.getElementById('btn-back-step2');

            if(type === 'recargas') {
                currentOrder.categoria = subType; 
                document.getElementById('title-step-2').innerText = 'Elige Operadora';
                renderBrands(['Claro', 'Movistar', 'CNT', 'Tuenti', 'Aki Móvil', 'Maxi Plus']);
                backBtn.onclick = () => showSubCategory();
            } else if(type === 'juegos') {
                currentOrder.categoria = 'Juegos';
                document.getElementById('title-step-2').innerText = 'Videojuegos';
                renderBrands(['Free Fire', 'Roblox', 'Call of Duty', 'Mobile Legends']);
                backBtn.onclick = () => goBack(1);
            }
            window.scrollTo(0,0);
        }

        function renderBrands(brands) {
            const grid = document.getElementById('grid-options');
            grid.innerHTML = '';
            brands.forEach(b => {
                const imgFile = imageMap[b] || 'default.webp';
                grid.innerHTML += `
                    <button onclick="handleBrandSelection('${b}')" class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl hover:border-white transition-all flex flex-col items-center gap-4 group">
                        <div class="w-16 h-16 md:w-20 md:h-20 flex items-center justify-center">
                            <img src="${imgFile}" alt="${b}" class="max-w-full max-h-full object-contain group-hover:scale-110 transition-transform">
                        </div>
                        <span class="font-bold uppercase text-[10px] md:text-xs tracking-widest text-zinc-400 group-hover:text-white">${b}</span>
                    </button>`;
            });
        }

        function handleBrandSelection(brand) {
            currentOrder.marca = brand;
            if (currentOrder.categoria === 'Paquetes' && paquetesData[brand]) {
                showPaquetesList(brand);
            } else {
                selectBrand(brand);
            }
        }

        function showPaquetesList(brand) {
            hideAllSteps();
            document.getElementById('step-paquetes').classList.remove('step-hidden');
            document.getElementById('title-paquetes').innerText = `Paquetes ${brand}`;
            const container = document.getElementById('lista-paquetes');
            container.innerHTML = '';
            
            paquetesData[brand].forEach(p => {
                container.innerHTML += `
                    <button onclick="selectPaquete('${p.nombre}', '${p.descuento}', '${p.detalle.replace(/'/g, "\\'")}')" class="bg-zinc-900 border border-zinc-800 p-5 rounded-3xl text-left hover:border-blue-500 transition-all flex justify-between items-center group">
                        <div class="pr-4">
                            <p class="font-black text-sm md:text-base uppercase italic text-white">${p.nombre}</p>
                            <p class="text-[10px] md:text-xs text-zinc-500 uppercase leading-tight mt-1 font-bold">${p.detalle}</p>
                        </div>
                        <div class="text-right min-w-[70px]">
                            <p class="text-[10px] text-zinc-600 line-through font-bold">$${p.precio}</p>
                            <p class="text-lg font-black text-green-500">$${p.descuento}</p>
                        </div>
                    </button>`;
            });
            window.scrollTo(0,0);
        }

        function selectPaquete(nombre, precio, detalle) {
            currentOrder.paqueteNombre = nombre;
            currentOrder.monto = precio;
            currentOrder.detalleCompleto = detalle;
            selectBrand(currentOrder.marca, true);
        }

        function selectBrand(brand, comesFromPaquete = false) {
            currentOrder.marca = brand;
            const fields = document.getElementById('form-fields');
            const detailLabel = document.getElementById('paquete-detalle-final');
            const backBtnStep3 = document.getElementById('btn-back-step3');

            document.getElementById('brand-selected').innerText = brand;
            
            if (comesFromPaquete) {
                detailLabel.innerText = currentOrder.detalleCompleto;
                backBtnStep3.onclick = () => showPaquetesList(brand);
            } else {
                detailLabel.innerText = currentOrder.categoria;
                backBtnStep3.onclick = () => goBack(2);
                currentOrder.paqueteNombre = null;
                currentOrder.monto = null;
            }

            const isRecarga = (currentOrder.categoria === 'Recargas' || currentOrder.categoria === 'Paquetes');
            
            fields.innerHTML = `
                <div class="space-y-2 text-left">
                    <label class="text-xs text-zinc-500 uppercase font-black tracking-widest ml-1">${isRecarga ? 'Número de Celular' : 'ID de Jugador'}</label>
                    <input type="tel" id="input-id" class="w-full bg-zinc-900 border border-zinc-800 p-5 rounded-2xl text-white outline-none focus:ring-2 focus:ring-blue-600" placeholder="${isRecarga ? '09xxxxxxxx' : 'ID del juego'}">
                </div>
                ${!comesFromPaquete ? `
                <div class="space-y-2 text-left">
                    <label class="text-xs text-zinc-500 uppercase font-black tracking-widest ml-1">${isRecarga ? 'Monto de Recarga' : 'Cantidad'}</label>
                    <input type="text" id="input-monto" class="w-full bg-zinc-900 border border-zinc-800 p-5 rounded-2xl text-white outline-none focus:ring-2 focus:ring-blue-600" placeholder="Ej: $3, $5, $10">
                </div>` : ''}`;
            
            hideAllSteps();
            document.getElementById('step-3').classList.remove('step-hidden');
            window.scrollTo(0,0);
        }

        function enviarPedido() {
            const id = document.getElementById('input-id').value;
            const monto = currentOrder.monto || document.getElementById('input-monto').value;
            if(!id || !monto) return alert('Por favor completa los datos');
            
            const numeroWhatsApp = "593992225484";
            const detalleExtra = currentOrder.detalleCompleto ? `\n*Paquete:* ${currentOrder.paqueteNombre}\n*Detalle:* ${currentOrder.detalleCompleto}` : '';
            const msg = `¡Hola Rexpres Play! 🚀\n\n*Servicio:* ${currentOrder.categoria}${detalleExtra}\n*Marca:* ${currentOrder.marca}\n*Número/ID:* ${id}\n*Monto Rexpres:* $${monto}`;
            window.open(`https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(msg)}`);
        }

        function goBack(step) {
            hideAllSteps();
            if(step === 1) {
                document.getElementById('step-1').classList.remove('step-hidden');
            } else if(step === 2) {
                showStep(2, (currentOrder.categoria === 'Juegos' ? 'juegos' : 'recargas'), currentOrder.categoria);
            }
        }
    </script>
</body>
</html>
