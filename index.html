<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rexpres Play - Catálogo Oficial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .step-hidden { display: none !important; }
        body { background-color: #000000; color: white; font-family: ui-sans-serif, system-ui; overflow-x: hidden; }
        .card-rex { background-color: #0a0a0a; border: 1px solid #1a1a1a; }
        .slider-container {
            position: relative; overflow: hidden; border-radius: 1.5rem;
            height: 180px; margin-bottom: 2rem; background-color: #111;
        }
        @media (min-width: 768px) { .slider-container { height: 350px; } }
        .slide {
            position: absolute; inset: 0; opacity: 0;
            transition: opacity 1s ease-in-out;
            background-size: cover; background-position: center;
        }
        .slide.active { opacity: 1; }
        .order-summary { background: rgba(255,255,255,0.03); border-radius: 1rem; padding: 1rem; margin-top: 1rem; }
        .menu-panel {
            display: none; position: absolute; right: 0; top: calc(100% + 10px);
            background: #111; border: 1px solid #222; border-radius: 1rem;
            min-width: 200px; z-index: 999; overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
        }
        .menu-panel.open { display: block; }
        .menu-item {
            display: block; width: 100%; padding: 14px 20px; color: white;
            text-align: left; background: none; border: none; cursor: pointer;
            font-size: 11px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 2px; border-bottom: 1px solid #1a1a1a; transition: background 0.2s;
        }
        .menu-item:last-child { border-bottom: none; }
        .menu-item:hover { background: #1a1a1a; }
        .menu-separator { padding: 8px 20px 4px; font-size: 9px; color: #555; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; background: #0a0a0a; }
        .skeleton { background: linear-gradient(90deg, #1a1a1a 25%, #222 50%, #1a1a1a 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 1rem; }
        @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    </style>
</head>
<body class="bg-black">

    <header class="p-4 bg-black border-b border-zinc-800 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <img src="logo.png" alt="Rexpres Play" class="h-10 md:h-14 w-auto cursor-pointer" onclick="goBack(1)">
            <div class="flex items-center gap-3">
                <span class="text-[10px] md:text-xs text-zinc-500 font-bold uppercase tracking-widest italic">Ecuador</span>
                <div style="position:relative;">
                    <button onclick="toggleMenu()" class="flex items-center gap-2 bg-zinc-900 border border-zinc-800 px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-widest hover:border-zinc-600 transition-all">
                        <svg class="w-4 h-4 fill-white" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                        Menú
                    </button>
                    <div class="menu-panel" id="menu-panel">
                        <!-- ✅ Directo a la tienda, sin modal -->
                        <button class="menu-item" onclick="goBack(1); closeMenu()">🏠 &nbsp;Tienda</button>
                        <div class="menu-separator">Acceso</div>
                        <!-- ✅ Directo a admin.html sin modal -->
                        <button class="menu-item" onclick="window.location.href='admin.html'">🛡️ &nbsp;Admin</button>
                        <!-- ✅ Directo a afiliado.html sin modal -->
                        <button class="menu-item" onclick="window.location.href='afiliado.html'">🤝 &nbsp;Afiliado</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 md:p-8">

        <!-- STEP 1 -->
        <section id="step-1">
            <div class="slider-container border border-zinc-800 shadow-2xl">
                <div class="slide active" style="background-image: url('banner1.png');"></div>
                <div class="slide" style="background-image: url('banner2.png');"></div>
            </div>
            <div class="text-center mb-10">
                <h2 class="text-2xl md:text-4xl font-black uppercase italic tracking-tighter text-white">¿Qué deseas realizar hoy?</h2>
                <p class="text-zinc-500 text-xs md:text-base uppercase tracking-widest mt-2 font-bold italic">Selecciona un servicio</p>
            </div>
            <div id="grid-categorias-principales" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="skeleton h-40 rounded-3xl"></div>
                <div class="skeleton h-40 rounded-3xl"></div>
            </div>
        </section>

        <!-- STEP SUB -->
        <section id="step-sub" class="step-hidden">
            <div class="flex items-center justify-between mb-8">
                <button onclick="goBack(1)" class="text-zinc-400 hover:text-white transition flex items-center text-sm font-bold uppercase tracking-widest">
                    <span class="mr-2">←</span> Inicio
                </button>
                <h2 class="text-xl md:text-2xl font-black italic uppercase text-center flex-1">¿Qué necesitas?</h2>
                <div class="w-10"></div>
            </div>
            <div class="grid grid-cols-2 gap-6 max-w-2xl mx-auto">
                <button onclick="showStep(2,'recargas','Recargas')" class="bg-zinc-900 border border-zinc-800 p-8 rounded-3xl hover:border-blue-500 transition-all group flex flex-col items-center gap-4">
                    <svg viewBox="0 0 24 24" class="w-12 h-12 fill-blue-500"><path d="M17 1H7c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-2-2-2zm0 18H7V5h10v14zm-4.25-11L10 11h3l-1.25 3L15 10h-3l1.25-3z"/></svg>
                    <span class="font-black uppercase italic tracking-widest text-sm md:text-lg text-white">Recargas</span>
                </button>
                <button onclick="showStep(2,'recargas','Paquetes')" class="bg-zinc-900 border border-zinc-800 p-8 rounded-3xl hover:border-blue-500 transition-all group flex flex-col items-center gap-4">
                    <svg viewBox="0 0 24 24" class="w-12 h-12 fill-orange-500"><path d="M20 6h-2.18c.11-.31.18-.65.18-1 0-1.66-1.34-3-3-3-1.05 0-1.96.54-2.5 1.35l-.5.65-.5-.65C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 12 7.4l3.38 4.6L17 10.83 14.92 8H20v6z"/></svg>
                    <span class="font-black uppercase italic tracking-widest text-sm md:text-lg text-white">Paquetes</span>
                </button>
            </div>
        </section>

        <!-- STEP 2: GRID MARCAS -->
        <section id="step-2" class="step-hidden">
            <div class="flex items-center justify-between mb-8">
                <button id="btn-back-step2" class="text-zinc-400 hover:text-white transition flex items-center text-sm font-bold uppercase tracking-widest">
                    <span class="mr-2">←</span> Volver
                </button>
                <h2 id="title-step-2" class="text-xl md:text-3xl font-black italic uppercase text-center flex-1 text-white"></h2>
                <div class="w-10"></div>
            </div>
            <div id="grid-options" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6"></div>
        </section>

        <!-- STEP PAQUETES -->
        <section id="step-paquetes" class="step-hidden">
            <div class="flex items-center justify-between mb-8">
                <button id="btn-back-paquetes" class="text-zinc-400 hover:text-white transition flex items-center text-sm font-bold uppercase tracking-widest">
                    <span class="mr-2">←</span> Regresar
                </button>
                <h2 id="title-paquetes" class="text-xl md:text-2xl font-black italic uppercase text-center flex-1 text-white"></h2>
                <div class="w-10"></div>
            </div>
            <div id="lista-paquetes" class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-4xl mx-auto"></div>
        </section>

        <!-- STEP 3: CHECKOUT -->
        <section id="step-3" class="step-hidden flex justify-center">
            <div class="card-rex p-8 md:p-12 rounded-[2rem] shadow-2xl w-full max-w-lg border-t-4 border-zinc-700">
                <button id="btn-back-step3" class="text-zinc-400 mb-6 inline-block text-xs font-bold uppercase tracking-widest hover:text-white">← Regresar</button>
                <h2 id="brand-selected" class="text-3xl md:text-4xl font-black mb-2 text-center uppercase italic text-white"></h2>
                <p id="paquete-detalle-final" class="text-center text-blue-400 font-bold uppercase text-[10px] md:text-xs tracking-widest mb-8 leading-tight"></p>
                <div id="form-fields" class="space-y-6"></div>

                <div id="seccion-cupon" class="mt-8 pt-8 border-t border-zinc-800 hidden">
                    <label class="text-xs text-zinc-500 uppercase font-black tracking-widest ml-1">¿Tienes un código?</label>
                    <div class="flex gap-2 mt-2">
                        <input type="text" id="promo-code" class="flex-1 bg-zinc-900 border border-zinc-800 p-4 rounded-xl text-white outline-none text-sm uppercase" placeholder="Código de Referido">
                        <button onclick="validarCodigo()" class="bg-zinc-800 px-6 rounded-xl font-bold text-xs uppercase hover:bg-zinc-700 transition-colors">Aplicar</button>
                    </div>
                    <p id="promo-msg" class="text-[10px] mt-2 font-bold uppercase hidden"></p>
                </div>

                <div class="order-summary mt-6">
                    <div class="flex justify-between text-xs text-zinc-400 uppercase font-bold mb-2">
                        <span>Subtotal</span><span id="resumen-subtotal">$0.00</span>
                    </div>
                    <div id="resumen-desc-row" class="flex justify-between text-xs text-green-500 uppercase font-bold mb-2 hidden">
                        <span>Descuento</span><span id="resumen-descuento">-$0.00</span>
                    </div>
                    <div class="flex justify-between text-lg font-black text-white uppercase italic pt-2 border-t border-zinc-800">
                        <span>Total Final</span><span id="resumen-total">$0.00</span>
                    </div>
                </div>

                <button onclick="enviarPedido()" id="btn-confirmar" class="w-full mt-10 bg-green-600 hover:bg-green-500 text-white font-black py-5 rounded-2xl shadow-lg transition-all uppercase tracking-widest text-base">
                    Confirmar pedido
                </button>
            </div>
        </section>
    </main>

    <script>
        const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbx_4-k82bMgzjU6aeCYaQWXfb4XxybjDN7WHsPt8uNNpxCgK8Lus1dI0ZjVCrIVHyFiyg/exec";

        let codigosValidos = {};
        let categoriasData = [];
        // ✅ Cache global de todos los productos cargados de una sola vez
        let todosLosProductos = [];

        let currentOrder = {
            categoria:'', marca:'', paqueteNombre:null,
            monto:0, detalleCompleto:'',
            descuentoAplicado:0, codigoUsado:'SISTEMA'
        };

        // ✅ Carga todo al inicio en paralelo — más rápido
        async function init() {
            const [resCats, resCods, resProd] = await Promise.all([
                fetch(URL_WEB_APP + '?accion=getCategorias').then(r=>r.json()).catch(()=>({categorias:[]})),
                fetch(URL_WEB_APP + '?accion=getCodigos').then(r=>r.json()).catch(()=>({codigos:{}})),
                fetch(URL_WEB_APP + '?accion=getProductos').then(r=>r.json()).catch(()=>({productos:[]}))
            ]);
            codigosValidos     = resCods.codigos || {};
            categoriasData     = (resCats.categorias || []).filter(c => c.activo);
            todosLosProductos  = resProd.productos || [];
            renderCategoriasIniciales();
        }

        function renderCategoriasIniciales() {
            const principales = categoriasData.filter(c => c.tipoServicio === 'Principal');
            const grid = document.getElementById('grid-categorias-principales');

            if(!principales.length) {
                grid.innerHTML = `
                <button onclick="showSubCategory()" style="background:#001e85;" class="p-8 md:p-12 rounded-3xl flex items-center gap-6 hover:scale-[1.02] transition-all shadow-xl text-left border border-blue-400/20">
                    <div class="w-16 h-16 md:w-20 md:h-20 flex items-center justify-center bg-white/10 rounded-2xl">
                        <svg viewBox="0 0 24 24" class="w-10 h-10 fill-white"><path d="M17 1H7c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-2-2-2zm0 18H7V5h10v14zm-4-15h-2v2h2V4zm-2 15h2v-2h-2v2zm1.25-11L9 11h3l-1.25 3L14 10h-3l1.25-3z"/></svg>
                    </div>
                    <div>
                        <p class="font-black text-xl md:text-3xl leading-tight text-white uppercase italic">Recargas Móviles</p>
                        <p class="text-xs text-blue-200 uppercase tracking-widest mt-1 font-bold">Saldo y Paquetes</p>
                    </div>
                </button>
                <button onclick="showStep(2,'juegos')" style="background:#f7941d;" class="p-8 md:p-12 rounded-3xl flex items-center gap-6 hover:scale-[1.02] transition-all shadow-xl text-left border border-orange-400/20">
                    <div class="w-16 h-16 md:w-20 md:h-20 flex items-center justify-center bg-black/10 rounded-2xl">
                        <span class="text-4xl md:text-5xl">🎮</span>
                    </div>
                    <div>
                        <p class="font-black text-xl md:text-3xl leading-tight text-white uppercase italic">Videojuegos</p>
                        <p class="text-xs text-orange-100 uppercase tracking-widest mt-1 font-bold">Diamantes y Monedas</p>
                    </div>
                </button>`;
                return;
            }

            grid.innerHTML = principales.map(c => {
                const icono = c.icono && c.icono.includes('.')
                    ? `<img src="${c.icono}" class="w-10 h-10 object-contain">`
                    : `<span class="text-4xl md:text-5xl">${c.icono || '📦'}</span>`;
                const accion = c.tipo === 'Recarga' ? `showSubCategory()` : `showStep(2,'juegos')`;
                return `
                <button onclick="${accion}" style="background:${c.colorFondo||'#1a1a2e'};" class="p-8 md:p-12 rounded-3xl flex items-center gap-6 hover:scale-[1.02] transition-all shadow-xl text-left border border-white/10">
                    <div class="w-16 h-16 md:w-20 md:h-20 flex items-center justify-center bg-white/10 rounded-2xl">${icono}</div>
                    <div>
                        <p class="font-black text-xl md:text-3xl leading-tight text-white uppercase italic">${c.nombre}</p>
                        <p class="text-xs text-white/70 uppercase tracking-widest mt-1 font-bold">${c.descripcion||''}</p>
                    </div>
                </button>`;
            }).join('');
        }

        // Slider
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        function nextSlide() {
            if(slides.length > 0) {
                slides[currentSlide].classList.remove('active');
                currentSlide = (currentSlide + 1) % slides.length;
                slides[currentSlide].classList.add('active');
            }
        }
        setInterval(nextSlide, 4000);

        // Menú
        function toggleMenu() { document.getElementById('menu-panel').classList.toggle('open'); }
        function closeMenu()  { document.getElementById('menu-panel').classList.remove('open'); }
        document.addEventListener('click', e => {
            if(!e.target.closest('#menu-panel') && !e.target.closest('button[onclick="toggleMenu()"]')) closeMenu();
        });

        // Navegación
        function hideAllSteps() {
            ['step-1','step-sub','step-2','step-paquetes','step-3'].forEach(id =>
                document.getElementById(id)?.classList.add('step-hidden'));
        }
        function showSubCategory() {
            hideAllSteps();
            document.getElementById('step-sub').classList.remove('step-hidden');
            window.scrollTo(0,0);
        }

        function showStep(step, type='', subType='') {
            hideAllSteps();
            document.getElementById('step-' + step).classList.remove('step-hidden');
            const backBtn = document.getElementById('btn-back-step2');

            if(type === 'recargas') {
                currentOrder.categoria = subType;
                document.getElementById('title-step-2').innerText = 'Elige Operadora';
                backBtn.onclick = () => showSubCategory();
                renderMarcas('Operadora');
            } else if(type === 'juegos') {
                currentOrder.categoria = 'Juegos';
                document.getElementById('title-step-2').innerText = 'Videojuegos';
                backBtn.onclick = () => goBack(1);
                renderMarcas('SubCategoria');
            }
            window.scrollTo(0,0);
        }

        // ✅ Renderiza marcas desde caché — instantáneo
        function renderMarcas(tipoServicio) {
            const grid = document.getElementById('grid-options');
            const marcas = categoriasData.filter(c => c.tipoServicio === tipoServicio && c.activo);

            if(!marcas.length) {
                grid.innerHTML = '<p class="col-span-4 text-center text-zinc-500 py-10">Sin categorías disponibles</p>';
                return;
            }
            grid.innerHTML = marcas.map(m => {
                const img = m.icono && m.icono.includes('.')
                    ? `<img src="${m.icono}" alt="${m.nombre}" class="max-w-full max-h-full object-contain group-hover:scale-110 transition-transform rounded-xl">`
                    : `<span class="text-4xl">${m.icono||'📦'}</span>`;
                return `
                <button onclick="handleBrandSelection('${m.nombre}')" class="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl hover:border-white transition-all flex flex-col items-center gap-4 group">
                    <div class="w-16 h-16 md:w-20 md:h-20 flex items-center justify-center">${img}</div>
                    <span class="font-bold uppercase text-[10px] md:text-xs tracking-widest text-zinc-400 group-hover:text-white">${m.nombre}</span>
                </button>`;
            }).join('');
        }

        function handleBrandSelection(brand) {
            currentOrder.marca = brand;
            // ✅ Recargas → checkout directo | Paquetes y Juegos → mostrar lista de paquetes
            if(currentOrder.categoria === 'Recargas') {
                selectBrand(brand, false);
            } else {
                // Paquetes de operadora O paquetes de juego — ambos muestran lista
                showPaquetesList(brand);
            }
        }

        // ✅ Usa caché local — sin llamada extra al Sheets
        function showPaquetesList(brand) {
            hideAllSteps();
            document.getElementById('step-paquetes').classList.remove('step-hidden');
            document.getElementById('title-paquetes').innerText = (currentOrder.categoria === 'Juegos' ? '' : 'Paquetes ') + brand;

            // Botón regresar según desde dónde viene
            const btnBack = document.getElementById('btn-back-paquetes');
            if(currentOrder.categoria === 'Juegos') {
                btnBack.onclick = () => showStep(2,'juegos');
            } else {
                btnBack.onclick = () => showStep(2,'recargas', currentOrder.categoria);
            }

            const container = document.getElementById('lista-paquetes');

            // ✅ Filtrar desde caché — instantáneo, sin fetch
            const productos = todosLosProductos.filter(p =>
                p.categoria.trim().toLowerCase() === brand.trim().toLowerCase() && p.activo
            );

            container.innerHTML = '';

            if(!productos.length) {
                container.innerHTML = '<p class="text-center text-zinc-500 py-10 col-span-2">Sin paquetes disponibles</p>';
                window.scrollTo(0,0);
                return;
            }

            productos.forEach(p => {
                const btn = document.createElement('button');
                btn.className = "bg-zinc-900 border border-zinc-800 p-5 rounded-3xl text-left hover:border-blue-500 transition-all flex justify-between items-center group w-full";
                const tieneDesc = parseFloat(p.precioNormal) > parseFloat(p.precioDesc);
                btn.innerHTML = `
                    <div class="pr-4">
                        <p class="font-black text-sm md:text-base uppercase italic text-white">${p.nombre}</p>
                        <p class="text-[10px] md:text-xs text-zinc-500 uppercase leading-tight mt-1 font-bold">${p.descripcion}</p>
                    </div>
                    <div class="text-right min-w-[70px]">
                        ${tieneDesc ? `<p class="text-[10px] text-zinc-600 line-through font-bold">$${parseFloat(p.precioNormal).toFixed(2)}</p>` : ''}
                        <p class="text-lg font-black text-green-500">$${parseFloat(p.precioDesc).toFixed(2)}</p>
                    </div>`;
                btn.addEventListener('click', () => selectPaquete(p.nombre, p.precioDesc, p.descripcion));
                container.appendChild(btn);
            });
            window.scrollTo(0,0);
        }

        function selectPaquete(nombre, precio, detalle) {
            currentOrder.paqueteNombre = nombre;
            currentOrder.monto = parseFloat(precio);
            currentOrder.detalleCompleto = detalle;
            selectBrand(currentOrder.marca, true);
        }

        function selectBrand(brand, comesFromPaquete=false) {
            currentOrder.marca = brand;
            currentOrder.descuentoAplicado = 0;
            currentOrder.codigoUsado = 'SISTEMA';
            const promoInput = document.getElementById('promo-code');
            const promoMsg   = document.getElementById('promo-msg');
            if(promoInput) promoInput.value = '';
            if(promoMsg) { promoMsg.innerText=''; promoMsg.className='text-[10px] mt-2 font-bold uppercase hidden'; }

            document.getElementById('brand-selected').innerText = brand;
            const detailLabel  = document.getElementById('paquete-detalle-final');
            const backBtnStep3 = document.getElementById('btn-back-step3');

            if(comesFromPaquete) {
                detailLabel.innerText = currentOrder.detalleCompleto;
                backBtnStep3.onclick = () => showPaquetesList(brand);
            } else {
                detailLabel.innerText = currentOrder.categoria;
                backBtnStep3.onclick = () => goBack(2);
                currentOrder.paqueteNombre = null;
                currentOrder.monto = 0;
            }

            const isRecarga = (currentOrder.categoria==='Recargas' || currentOrder.categoria==='Paquetes');
            const isJuego   = (currentOrder.categoria==='Juegos');
            document.getElementById('seccion-cupon').classList.toggle('hidden', !isJuego);

            document.getElementById('form-fields').innerHTML = `
                <div class="space-y-2 text-left">
                    <label class="text-xs text-zinc-500 uppercase font-black tracking-widest ml-1">${isRecarga ? 'Número de Celular' : 'ID de Jugador'}</label>
                    <input type="${isRecarga ? 'tel' : 'text'}" id="input-id" class="w-full bg-zinc-900 border border-zinc-800 p-5 rounded-2xl text-white outline-none focus:ring-2 focus:ring-blue-600" placeholder="${isRecarga ? '09xxxxxxxx' : 'ID del juego'}">
                </div>
                ${!comesFromPaquete ? `<div class="space-y-2 text-left">
                    <label class="text-xs text-zinc-500 uppercase font-black tracking-widest ml-1">${isRecarga ? 'Monto de Recarga ($)' : 'Cantidad ($)'}</label>
                    <input type="number" id="input-monto" min="0.01" step="0.01" oninput="actualizarCheckout()" class="w-full bg-zinc-900 border border-zinc-800 p-5 rounded-2xl text-white outline-none focus:ring-2 focus:ring-blue-600" placeholder="0.00">
                </div>` : ''}`;

            hideAllSteps();
            document.getElementById('step-3').classList.remove('step-hidden');
            actualizarCheckout();
            window.scrollTo(0,0);
        }

        function validarCodigo() {
            const input = document.getElementById('promo-code').value.toUpperCase().trim();
            const msg   = document.getElementById('promo-msg');
            if(codigosValidos[input] !== undefined) {
                currentOrder.descuentoAplicado = Number(codigosValidos[input]);
                currentOrder.codigoUsado = input;
                msg.innerText = '¡Código ' + input + ' aplicado! Descuento de $' + currentOrder.descuentoAplicado.toFixed(2);
                msg.className = "text-[10px] mt-2 font-bold uppercase text-green-500 block";
            } else {
                currentOrder.descuentoAplicado = 0;
                currentOrder.codigoUsado = 'SISTEMA';
                msg.innerText = "Código no válido";
                msg.className = "text-[10px] mt-2 font-bold uppercase text-red-500 block";
            }
            actualizarCheckout();
        }

        function actualizarCheckout() {
            const inputMonto = document.getElementById('input-monto');
            let subtotal  = currentOrder.paqueteNombre ? currentOrder.monto : (parseFloat(inputMonto?.value)||0);
            let totalFinal = Math.max(subtotal - currentOrder.descuentoAplicado, 0);
            document.getElementById('resumen-subtotal').innerText  = '$' + subtotal.toFixed(2);
            document.getElementById('resumen-descuento').innerText = '-$' + currentOrder.descuentoAplicado.toFixed(2);
            document.getElementById('resumen-total').innerText     = '$' + totalFinal.toFixed(2);
            document.getElementById('resumen-desc-row').classList.toggle('hidden', currentOrder.descuentoAplicado <= 0);
        }

        function enviarPedido() {
            const idInput    = document.getElementById('input-id');
            const inputMonto = document.getElementById('input-monto');
            const id         = idInput ? idInput.value.trim() : '';
            const subtotal   = currentOrder.paqueteNombre ? currentOrder.monto : (parseFloat(inputMonto?.value)||0);
            const totalFinal = Math.max(subtotal - currentOrder.descuentoAplicado, 0);
            const isRecarga  = (currentOrder.categoria==='Recargas' || currentOrder.categoria==='Paquetes');

            if(!id) { alert('Por favor ingresa tu número de celular o ID de jugador.'); idInput?.focus(); return; }
            if(isRecarga && !/^09\d{8}$/.test(id)) { alert('Ingresa un número válido (debe empezar con 09 y tener 10 dígitos).'); idInput?.focus(); return; }
            if(subtotal <= 0) { alert('Por favor ingresa un monto válido mayor a $0.00.'); inputMonto?.focus(); return; }

            const btn = document.getElementById('btn-confirmar');
            btn.disabled = true; btn.innerText = 'Enviando...';
            btn.classList.add('opacity-60','cursor-not-allowed');

            const datosExcel = {
                fecha: new Date().toLocaleString(), cliente: id,
                servicio: currentOrder.categoria, marca: currentOrder.marca,
                monto: subtotal.toFixed(2), codigo: currentOrder.codigoUsado,
                descuento: currentOrder.descuentoAplicado.toFixed(2),
                total: totalFinal.toFixed(2), estado: "PENDIENTE"
            };

            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = URL_WEB_APP + '?datos=' + encodeURIComponent(JSON.stringify(datosExcel));
            document.body.appendChild(iframe);
            setTimeout(() => { try { document.body.removeChild(iframe); } catch(e){} }, 5000);

            setTimeout(() => {
                btn.disabled = false; btn.innerText = 'Confirmar pedido';
                btn.classList.remove('opacity-60','cursor-not-allowed');
            }, 3000);

            const detalleExtra = currentOrder.detalleCompleto
                ? '\n*Paquete:* ' + currentOrder.paqueteNombre + '\n*Detalle:* ' + currentOrder.detalleCompleto : '';
            const msg = '¡Hola Rexpres Play! 🚀\n\n*Servicio:* ' + currentOrder.categoria + detalleExtra +
                '\n*Marca:* ' + currentOrder.marca + '\n*Número/ID:* ' + id +
                '\n*Subtotal:* $' + subtotal.toFixed(2) +
                '\n*Código:* ' + currentOrder.codigoUsado +
                '\n*Total Final:* $' + totalFinal.toFixed(2);
            window.open('https://wa.me/593992225484?text=' + encodeURIComponent(msg));
        }

        function goBack(step) {
            hideAllSteps();
            if(step===1) document.getElementById('step-1').classList.remove('step-hidden');
            else if(step===2) showStep(2, currentOrder.categoria==='Juegos' ? 'juegos' : 'recargas', currentOrder.categoria);
        }

        init();
    </script>
</body>
</html>
