<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paquetes — Rexpres Play</title>
<link rel="stylesheet" href="rexpres.css">
<style>
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; }
main { flex: 1; }

/* ✅ Grid que ocupa todo el ancho disponible */
.packs-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  width: 100%;
}
@media (min-width: 500px)  { .packs-grid { grid-template-columns: repeat(3,1fr); gap: 14px; } }
@media (min-width: 800px)  { .packs-grid { grid-template-columns: repeat(4,1fr); gap: 16px; } }
@media (min-width: 1100px) { .packs-grid { grid-template-columns: repeat(5,1fr); } }

.pack {
  background: #131320;
  border: 1px solid #21213a;
  border-radius: 16px;
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  transition: border-color .2s, box-shadow .2s;
  text-align: center;
  gap: 6px;
  text-decoration: none;
  /* ✅ Sin transform para no mover cards vecinas */
}
.pack:hover {
  border-color: #f7941d;
  box-shadow: 0 0 0 1px rgba(247,148,29,.25);
}
.pack:active { opacity: .85; }

.pack-ico   { font-size: 28px; margin-bottom: 2px; }
.pack-name  { font-size: 12px; font-weight: 800; color: white; line-height: 1.3; }
.pack-desc  { font-size: 10px; color: #64748b; line-height: 1.4; }
.pack-old   { font-size: 10px; color: #334155; text-decoration: line-through; font-weight: 700; margin-top: 4px; }
.pack-price { font-size: 18px; font-weight: 900; color: #f7941d; margin-top: 2px; }

/* ✅ Spinner grande que ocupa toda la pantalla disponible */
.spinner-full {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 50vh;
  gap: 18px;
}
.spinner-big {
  width: 56px;
  height: 56px;
  border: 4px solid #21213a;
  border-top-color: #f7941d;
  border-radius: 50%;
  animation: spin .75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.spinner-big-txt {
  font-size: 12px;
  font-weight: 700;
  color: #64748b;
  text-transform: uppercase;
  letter-spacing: 2px;
}

/* Drawer/login */
.di-clean { display: block; width: 100%; padding: 14px 20px; background: none; border: none; border-bottom: 1px solid #21213a; color: #94a3b8; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: background .15s, color .15s; text-align: left; text-decoration: none; }
.di-clean:last-child { border-bottom: none; }
.di-clean:hover { background: rgba(255,255,255,.04); color: white; }
.login-opt { display: flex; align-items: center; justify-content: space-between; padding: 16px; background: #1a1a28; border: 1px solid #21213a; border-radius: 14px; margin-bottom: 10px; text-decoration: none; transition: border-color .2s; }
.login-opt:hover { border-color: #f7941d; }
.login-opt:last-of-type { margin-bottom: 0; }
</style>
</head>
<body>

<!-- MODAL LOGIN -->
<div id="modal-login" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;align-items:center;justify-content:center;padding:16px;">
  <div style="background:#131320;border:1px solid #21213a;border-radius:20px;padding:28px;width:100%;max-width:340px;">
    <p style="font-size:16px;font-weight:800;color:white;margin-bottom:4px;">Iniciar sesión</p>
    <p style="font-size:11px;color:#64748b;font-weight:600;margin-bottom:20px;">Selecciona cómo deseas acceder</p>
    <a class="login-opt" href="admin.html">
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="width:36px;height:36px;border-radius:10px;background:rgba(0,30,133,.3);display:flex;align-items:center;justify-content:center;font-size:18px;">🛡️</div>
        <div><div style="font-size:13px;font-weight:800;color:white;">Administrador</div><div style="font-size:10px;color:#64748b;">Panel de control completo</div></div>
      </div>
      <span style="color:#64748b;font-size:20px;">›</span>
    </a>
    <a class="login-opt" href="afiliado.html">
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="width:36px;height:36px;border-radius:10px;background:rgba(247,148,29,.15);display:flex;align-items:center;justify-content:center;font-size:18px;">🤝</div>
        <div><div style="font-size:13px;font-weight:800;color:white;">Afiliado</div><div style="font-size:10px;color:#64748b;">Ver mis comisiones y pedidos</div></div>
      </div>
      <span style="color:#64748b;font-size:20px;">›</span>
    </a>
    <button onclick="cerrarLogin()" style="width:100%;background:none;border:1px solid #21213a;border-radius:12px;padding:12px;color:#64748b;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;cursor:pointer;margin-top:14px;">Cancelar</button>
  </div>
</div>

<!-- DRAWER -->
<div class="drawer-overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <img src="logo.png" alt="Rexpres Play" style="height:32px;">
    <button class="drawer-close" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-nav">
    <a class="di-clean" href="index.html">Tienda</a>
    <button class="di-clean" onclick="abrirLogin()">Iniciar sesión</button>
  </div>
  <div class="drawer-foot">
    <p style="font-size:10px;color:#334155;font-weight:700;text-transform:uppercase;letter-spacing:1px;">© 2026 Rexpres Play · Ecuador</p>
  </div>
</div>

<!-- HEADER -->
<header class="hdr">
  <div class="hdr-in">
    <div style="display:flex;align-items:center;gap:14px;">
      <button class="burger" onclick="openDrawer()">
        <svg width="22" height="22" fill="white" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
      </button>
      <a href="index.html"><img src="logo.png" alt="Rexpres Play" style="height:36px;display:block;"></a>
    </div>
    <span style="font-size:10px;font-weight:800;color:#334155;text-transform:uppercase;letter-spacing:2px;">🇪🇨 Ecuador</span>
  </div>
</header>

<main>
  <div style="max-width:1100px;margin:0 auto;padding:20px 16px 32px;">
    <a class="back-btn" id="back-link" href="index.html">← Regresar</a>
    <h2 class="pg-title" id="pg-title">Paquetes</h2>
    <!-- ✅ Spinner mostrado desde el HTML, sin esperar JS -->
    <div id="grid" class="packs-grid">
      <div class="spinner-full">
        <div class="spinner-big"></div>
        <span class="spinner-big-txt">Cargando paquetes...</span>
      </div>
    </div>
  </div>
</main>

<footer style="text-align:center;padding:20px 16px;border-top:1px solid #21213a;margin-top:auto;">
  <p style="font-size:10px;color:#334155;font-weight:700;text-transform:uppercase;letter-spacing:2px;">© 2026 Rexpres Play · Ecuador · Todos los derechos reservados</p>
</footer>

<script src="rexpres.js"></script>
<script>
const params  = new URLSearchParams(location.search);
const cat     = params.get('cat')   || 'Paquetes';
const marca   = params.get('marca') || '';

guardar('cat', cat); guardar('marca', marca);

// Back link
const bl = document.getElementById('back-link');
bl.href = cat === 'Juegos' ? 'juegos.html' : `operadoras.html?tipo=${encodeURIComponent(cat)}`;

document.getElementById('pg-title').innerText = marca;

// Icono dinámico según juego
function getIcono(marcaNom, subTipo) {
  const m = marcaNom.toLowerCase();
  if (m.includes('blood'))   return '🪙';
  if (m.includes('mobile'))  return '💠';
  if (subTipo === 'Diamantes') return '💎';
  if (subTipo === 'Paquete')   return '📦';
  if (subTipo === 'Recarga')   return '💳';
  return '🎮';
}

function renderPaquetes(productos) {
  const grid  = document.getElementById('grid');
  const prods = productos.filter(p =>
    p.categoria.trim().toLowerCase() === marca.trim().toLowerCase() && p.activo
  );

  if (!prods.length) {
    grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#64748b;padding:60px 0;font-size:14px;">Sin paquetes disponibles</p>';
    return;
  }

  grid.innerHTML = '';
  prods.forEach(p => {
    const tieneDesc = parseFloat(p.precioNormal) > parseFloat(p.precioDesc);
    const ico  = getIcono(marca, p.subTipo);
    const desc = p.descripcion.length > 60 ? p.descripcion.substring(0,60)+'...' : p.descripcion;
    const url  = `checkout.html?cat=${encodeURIComponent(cat)}&marca=${encodeURIComponent(marca)}&paq=${encodeURIComponent(p.nombre)}&precio=${p.precioDesc}&detalle=${encodeURIComponent(p.descripcion)}`;

    const a = document.createElement('a');
    a.className = 'pack';
    a.href = url;
    a.innerHTML = `
      <div class="pack-ico">${ico}</div>
      <div class="pack-name">${p.nombre}</div>
      <div class="pack-desc">${desc}</div>
      ${tieneDesc ? `<div class="pack-old">$${parseFloat(p.precioNormal).toFixed(2)}</div>` : ''}
      <div class="pack-price">$${parseFloat(p.precioDesc).toFixed(2)}</div>`;
    grid.appendChild(a);
  });
}

// Cargar paquetes del Sheets
fetch(API + '?accion=getProductos&categoria=' + encodeURIComponent(marca))
  .then(r => r.json())
  .then(d => renderPaquetes(d.productos || []))
  .catch(() => {
    document.getElementById('grid').innerHTML =
      '<p style="grid-column:1/-1;text-align:center;color:#64748b;padding:60px 0;">Error al cargar. Intenta de nuevo.</p>';
  });

function abrirLogin()  { document.getElementById('modal-login').style.display='flex'; closeDrawer(); }
function cerrarLogin() { document.getElementById('modal-login').style.display='none'; }
document.getElementById('modal-login').addEventListener('click',function(e){if(e.target===this)cerrarLogin();});
</script>
</body>
</html>
